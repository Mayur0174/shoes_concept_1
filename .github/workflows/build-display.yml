name: build-display

on:
  push:
    branches: [main]
    paths:
      - "params_display.json"
      - "build_display.py"
      - "soletta/display.py"
      - ".github/workflows/build-display.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-display
  cancel-in-progress: true

jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build display model
        run: |
          python build_display.py --res 0.4 --out out_display 2>&1 | grep -v slab | tee display_log.txt
          mkdir -p release
          cd out_display && zip -q -9 ../release/soletta_display_model.zip *.stl soletta_display.glb
          cd step && zip -q -9 ../../release/soletta_display_STEP.zip *.step

      - name: Publish display release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: display-${{ github.run_number }}
          name: Soletta display model ${{ github.run_number }} (photo-matched)
          body: |
            High-detail display model traced from the reference photos. It is for renders and viewing, not for printing; the printable, working shoe is in the build-N releases.
            soletta_display_model.zip: one STL per part plus a combined GLB.
            soletta_display_STEP.zip: soletta_display_assembly.step (named, coloured parts; organic parts as faceted solids, dials and buckles as exact solids) plus one STEP per part.
          files: release/*
